<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>&nbsp;</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #000; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px 16px; box-sizing: border-box; }
  img { display: block; width: 100%; max-width: 900px; height: auto; opacity: 0; animation: in 6s ease-in 0.5s forwards; }
  p { color: #bbb; font: 16px "Courier New", monospace; letter-spacing: 2px; margin: 28px 0 0; min-height: 1.4em; text-align: center; }
  .ph { position: relative; width: 100%; max-width: 900px; }
  .ph img { max-width: none; }
  .h { position: absolute; left: 66%; top: 34%; margin: 0; color: transparent; font: 15px Georgia, serif; letter-spacing: 3px; transform: rotate(90deg); transform-origin: left top; white-space: nowrap; min-height: 0; }
  ::selection { background: #fff; color: #000; }
  @keyframes in { to { opacity: 1; } }
</style>
</head>
<body>
<div class="ph"><img src="les.jpg" alt=""><p class="h">Konferansieri i Errët</p></div>
<p id="t"></p>
<script>
  var text = "не стоило идти на крики в лесу", i = 0, el = document.getElementById("t");
  function type() {
    if (i > text.length) return;
    el.textContent = text.slice(0, i++);
    setTimeout(type, 90 + Math.random() * 160);
  }
  setTimeout(type, 6500);
</script>
</body>
</html>
