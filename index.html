<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>&nbsp;</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #000; }
  body { font: 13px Tahoma, "MS Sans Serif", Arial, sans-serif; color: #000; }
  * { box-sizing: border-box; }

  .win { background: #c0c0c0; border: 2px solid; border-color: #fff #404040 #404040 #fff; box-shadow: 1px 1px 0 #000; }
  .bar { background: #000; color: #fff; padding: 3px 4px 3px 6px; font-weight: bold; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .bar span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .x { width: 18px; height: 16px; line-height: 12px; padding: 0; font: bold 11px Arial, sans-serif; background: #c0c0c0; color: #000; border: 2px solid; border-color: #fff #404040 #404040 #fff; cursor: pointer; flex: none; }
  .btn { padding: 4px 18px; font: 13px Tahoma, Arial, sans-serif; background: #c0c0c0; color: #000; border: 2px solid; border-color: #fff #404040 #404040 #fff; cursor: pointer; }
  .btn:active, .x:active { border-color: #404040 #fff #fff #404040; }
  input { width: 100%; border: 2px solid; border-color: #808080 #fff #fff #808080; padding: 3px; font: 14px "Courier New", monospace; background: #fff; color: #000; }
  label { display: block; margin: 8px 0 3px; }

  #login { max-width: 340px; margin: 12vh auto 0; padding: 0 16px; }
  #login .in { padding: 14px; }
  #err { font-weight: bold; min-height: 1em; margin-top: 10px; }

  #ex { display: none; max-width: 760px; margin: 6vh auto 40px; padding: 0 16px; }
  .addr { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-bottom: 1px solid #808080; }
  .addr b { font-weight: normal; }
  .addr div { flex: 1; background: #fff; border: 2px solid; border-color: #808080 #fff #fff #808080; padding: 2px 4px; font-family: "Courier New", monospace; white-space: nowrap; overflow: hidden; }
  .body { display: flex; min-height: 320px; }
  .tree { width: 170px; flex: none; background: #fff; margin: 6px 0 6px 6px; border: 2px solid; border-color: #808080 #fff #fff #808080; padding: 6px 4px; font-size: 12px; }
  .tree div { padding: 2px 4px; cursor: pointer; white-space: nowrap; }
  .tree div.sel { background: #000; color: #fff; }
  .files { flex: 1; background: #fff; margin: 6px; border: 2px solid; border-color: #808080 #fff #fff #808080; padding: 10px; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 6px; }
  .f { width: 108px; text-align: center; padding: 6px 2px; cursor: pointer; font-size: 12px; overflow-wrap: anywhere; border: 1px dotted transparent; }
  .f:hover { border-color: #000; }
  .f svg { display: block; margin: 0 auto 4px; }
  .f.new span { animation: bl 1s steps(1) infinite; }
  @keyframes bl { 50% { visibility: hidden; } }
  .status { display: flex; justify-content: space-between; padding: 3px 6px; border-top: 1px solid #808080; font-size: 12px; }
  @media (max-width: 560px) { .tree { display: none; } .body { min-height: 260px; } }

  #dlg { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.4); z-index: 20; padding: 16px; }
  #dlg .win { width: 320px; }
  #dlg .in { padding: 14px; }

  #note { position: fixed; inset: 0; background: #000; display: none; overflow-y: auto; z-index: 10; }
  #note .sheet { position: relative; height: 320vh; min-height: 2400px; overflow: hidden; }
  #note .sheet p { position: absolute; margin: 0; max-width: 80vw; line-height: 1.5; color: #000; }
  #note .sheet p.m { font: 12px/2 "Courier New", monospace; max-width: min(620px, 84vw); }
  #note .sheet p.late { display: none; }
  #note ::selection { background: #fff; color: #000; }

  #view { position: fixed; inset: 0; background: #000; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px; z-index: 10; overflow-y: auto; }
  .close { position: fixed; top: 10px; right: 14px; color: #555; font: 14px "Courier New", monospace; cursor: pointer; z-index: 12; background: none; border: 0; }
  .close:hover { color: #aaa; }
  .ph { position: relative; width: 100%; max-width: 900px; }
  .ph > img { display: block; width: 100%; height: auto; opacity: 0; animation: in 6s ease-in .5s forwards; }
  .ph.flash > img { animation: none; opacity: 1; filter: brightness(var(--b, 2.4)) contrast(1.4); transform: translate(var(--x, 3px), var(--y, -2px)) scale(1.03); }
  .ph.dim > img { filter: brightness(.35); transition: filter .6s; }
  .ph .hot { position: absolute; }
  .ph .hidden { position: absolute; margin: 0; color: transparent; font: 15px Georgia, serif; letter-spacing: 3px; transform: rotate(90deg); transform-origin: left top; white-space: nowrap; }
  #view ::selection { background: #fff; color: #000; }
  #cap { color: #bbb; font: 16px "Courier New", monospace; letter-spacing: 2px; margin: 28px 0 0; min-height: 1.4em; text-align: center; }
  @keyframes in { to { opacity: 1; } }

  #tb { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 15; }
  #tb img { width: min(320px, 70vw); animation: rise 2.5s ease-out forwards; }
  #tb p { color: #bbb; font: 16px "Courier New", monospace; letter-spacing: 2px; margin-top: 24px; min-height: 1.4em; }
  @keyframes rise { from { opacity: 0; transform: scale(.4) rotate(-200deg); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>

<div id="login">
  <form class="win" id="lf" autocomplete="off">
    <div class="bar"><span>Вход в архив</span></div>
    <div class="in">
      Введите имя пользователя и пароль.
      <label for="u">Имя пользователя:</label>
      <input id="u" type="text" spellcheck="false" autocapitalize="off">
      <label for="pw">Пароль:</label>
      <input id="pw" type="password">
      <button type="submit" class="btn" id="ok" style="margin-top:14px">OK</button>
      <div id="err"></div>
    </div>
  </form>
</div>

<div id="ex">
  <div class="win">
    <div class="bar"><span id="title">Проводник</span><button class="x" id="logout" title="Выход">x</button></div>
    <div class="addr"><b>Адрес</b><div id="path"></div></div>
    <div class="body">
      <div class="tree" id="tree"></div>
      <div class="files" id="files"></div>
    </div>
    <div class="status"><span id="count"></span><span id="size"></span></div>
  </div>
</div>

<div id="dlg">
  <form class="win" id="df" autocomplete="off">
    <div class="bar"><span>Доступ ограничен</span><button type="button" class="x" id="dx">x</button></div>
    <div class="in">
      <div id="dmsg">Папка защищена паролем.</div>
      <label for="dp">Пароль:</label>
      <input id="dp" type="text" spellcheck="false" autocapitalize="off">
      <button type="submit" class="btn" style="margin-top:14px">OK</button>
      <div id="derr" style="font-weight:bold;min-height:1em;margin-top:10px"></div>
    </div>
  </form>
</div>

<div id="note"><button class="close" data-close>[ закрыть ]</button><div class="sheet" id="sheet"></div></div>

<div id="view">
  <button class="close" data-close>[ закрыть ]</button>
  <div class="ph" id="ph"></div>
  <p id="cap"></p>
</div>

<div id="tb"><img alt=""><p></p></div>

  var KEY = null, M = null, cache = {};

  function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }
  function $(id) { return document.getElementById(id); }

  function deriveKey(user, pass) {
    var enc = new TextEncoder();
    return crypto.subtle.importKey("raw", enc.encode(user.trim().toLowerCase() + ":" + pass), "PBKDF2", false, ["deriveKey"])
      .then(function (base) {

    return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(p[0]) }, KEY, b64(p[1]))
      .then(function (buf) { return new TextDecoder().decode(buf); });
  }

  function media(id) {
    if (cache[id]) return Promise.resolve(cache[id]);
    var f = M.blobs[id];
    return fetch("d/" + f.bin).then(function (r) { return r.arrayBuffer(); }).then(function (buf) {
      var u = new Uint8Array(buf);
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: u.slice(0, 12) }, KEY, u.slice(12));
    }).then(function (plain) {
      return (cache[id] = URL.createObjectURL(new Blob([plain], { type: f.type })));
    });
  }

  function seen(id) { try { localStorage.setItem("seen_" + id, "1"); } catch (e) {} }
  function wasSeen(id) { try { return !!localStorage.getItem("seen_" + id); } catch (e) { return false; } }
  function allSeen() { return M.unlock.every(wasSeen); }

  /* ---------- вход ---------- */

  function unlock(key, remember) {
    KEY = key;
    return decryptText(MANIFEST).then(function (json) {
      M = JSON.parse(json);
      if (remember) {
        crypto.subtle.exportKey("raw", key).then(function (raw) {
          try { sessionStorage.setItem("k", btoa(String.fromCharCode.apply(null, new Uint8Array(raw)))); } catch (e) {}
        });
      }
      $("login").style.display = "none";
      $("ex").style.display = "block";
      openFolder(M.root);
    }, function (e) { KEY = null; throw e; });
  }

  $("lf").onsubmit = function (e) {

      })

  };

  };
  var openDirs = {};

  function folderPath(id) {
    var parts = [], d = M.dirs[id];
    while (d) { parts.unshift(d.name); d = M.dirs[d.parent]; }
    return parts.join("\\") + "\\";
  }

  function renderTree(cur) {
    var t = $("tree"); t.innerHTML = "";
    (function walk(id, depth) {
      var d = M.dirs[id], row = document.createElement("div");
      row.textContent = (d.locked && !openDirs[id] ? "▪ " : "▫ ") + d.name;

      if (id === cur) row.className = "sel";
      row.onclick = function () { openFolder(id); };
      t.appendChild(row);

    })(M.root, 0);
  }

  function openFolder(id) {
    var d = M.dirs[id];
    if (d.locked && !openDirs[id]) return askPassword(id);

    $("title").textContent = "Проводник - " + d.name;
    renderTree(id);
    var box = $("files"), n = 0, bytes = 0;
    box.innerHTML = "";
    if (d.parent) addIcon(box, "dir", "..", function () { openFolder(d.parent); });
    d.items.forEach(function (it) {
      if (M.dirs[it]) { n++; addIcon(box, M.dirs[it].locked && !openDirs[it] ? "lock" : "dir", M.dirs[it].name, function () { openFolder(it); }); return; }

  }

  function openFile(id) {
    var f = M.files[id];
    if (f.kind === "txt") return openNote(f);
    seen(id);
    closeAll();
    var ph = $("ph"), cap = $("cap"), typed = false;
    ph.className = "ph"; ph.innerHTML = ""; cap.textContent = "";
    $("view").style.display = "flex";
    if (f.comment) ph.appendChild(document.createComment(f.comment));

    var img = new Image();
    img.alt = "";
    function settle() { img.style.animation = "none"; img.style.opacity = "1"; }
    img.addEventListener("animationend", settle);
    ph.appendChild(img);
    media(f.img).then(function (url) { img.src = url; });
    if (f.sound) media(f.sound);

    if (f.hiddenText) {
      var h = document.createElement("p");
      h.className = "hidden"; h.textContent = f.hiddenText.text;
      h.style.left = f.hiddenText.at[0] + "%"; h.style.top = f.hiddenText.at[1] + "%";
      ph.appendChild(h);
    }

    function hit() {
      settle();
      if (f.sound) play(f.sound);
      effect(ph, f.effect, f.bright);
      if (f.capMode === "click" && !typed) { typed = true; later(function () { typeCap(f.caption, cap); }, 900); }
    }

    if (f.zone) {
      var z = document.createElement("div");
      z.className = "hot"; setRect(z, f.zone);
      z.onclick = hit;
      ph.appendChild(z);
    } else {
      ph.onclick = hit;
    }
    ph.style.cursor = f.zone ? "" : "default";

    (f.spots || []).forEach(function (s) {
      var el = document.createElement("div");
      el.className = "hot"; setRect(el, s.rect);
      if (s.pointer) el.style.cursor = "pointer";
      el.onclick = function (e) {
        e.stopPropagation();
        settle();
        if (s.open) openFile(s.open);
        if (s.tabu) showTabu(s.tabu);
      };
      ph.appendChild(el);
    });

    if (f.capMode === "auto") later(function () { typeCap(f.caption, cap); }, 6500);
  }

  function setRect(el, r) {
    el.style.left = r[0] + "%"; el.style.top = r[1] + "%";
    el.style.width = r[2] + "%"; el.style.height = r[3] + "%";
  }

  function showTabu(t) {
    snd.pause();
    var tb = $("tb"), im = tb.querySelector("img"), p = tb.querySelector("p");
    p.textContent = "";
    media(t.gif).then(function (url) {
      im.src = url;
      im.style.animation = "none"; im.offsetWidth; im.style.animation = "";
      tb.style.display = "flex";
      play(t.sound);
      typeCap(t.text, p);
    });
  }
  $("tb").onclick = function () { $("tb").style.display = "none"; snd.pause(); };

  function closeAll() {
    timers.forEach(clearTimeout); timers = [];
    snd.pause();
    ["view", "note", "tb"].forEach(function (id) { $(id).style.display = "none"; });
  }

  document.querySelectorAll("[data-close]").forEach(function (b) {
    b.onclick = function () { closeAll(); if (M) openFolder(currentDir()); };
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && M) { closeAll(); $("dlg").style.display = "none"; openFolder(currentDir()); }
  });

  function currentDir() {
    var p = $("path").textContent;
    for (var id in M.dirs) if (folderPath(id) === p) return id;
    return M.root;
  }
</script>
</body>
</html>
