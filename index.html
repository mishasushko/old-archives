<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100e0b">
  <title>ВОЛГА / Машина времени</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #100e0b;
      --ink: #fff1d7;
      --amber: #ffb85c;
      --muted: #bfaa8f;
      --line: #5a4330;
      --mono: ui-monospace, "Courier New", monospace;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); }
    .console {
      width: min(100% - 3rem, 85rem);
      min-height: 100svh;
      margin: auto;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding-block: clamp(1.25rem, 4vw, 3rem);
    }
    .rail, .readouts {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      font: 700 .75rem/1.5 var(--mono);
      letter-spacing: .1em;
    }
    .rail { padding-bottom: 1rem; border-bottom: 1px solid var(--line); }
    .brand { color: var(--amber); }
    .signal { color: var(--muted); text-align: right; }
    .signal::before {
      content: "";
      display: inline-block;
      width: .5rem;
      height: .5rem;
      margin-right: .65em;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 .8rem var(--amber);
      animation: signal 3s ease-in-out infinite;
    }
    @keyframes signal { 50% { opacity: .55; } }
    .hero {
      display: grid;
      grid-template-columns: 1fr 1.07fr;
      align-items: center;
      column-gap: 1rem;
      padding-block: clamp(2.75rem, 8vw, 7rem);
    }
    .eyebrow {
      margin: 0 0 1.15rem;
      color: var(--amber);
      font: 700 .75rem/1.5 var(--mono);
      letter-spacing: .13em;
    }
    h1 {
      margin: 0;
      font: 800 clamp(2.1rem, 5.5vw, 5.5rem)/.99 system-ui, sans-serif;
      letter-spacing: -.065em;
    }
    h1 em { color: var(--amber); font-style: normal; }
    .machine {
      position: relative;
      margin: 0;
      min-width: 0;
      background: radial-gradient(ellipse at 56% 47%, #6d311a55, transparent 66%);
    }
    svg { display: block; width: 100%; height: auto; }
    .readouts {
      border-top: 1px solid var(--line);
      padding-top: 1rem;
      align-items: flex-start;
      color: var(--muted);
    }
    .readouts div { display: grid; gap: .4rem; }
    .readouts dt { font-size: .68rem; }
    .readouts dd { margin: 0; color: var(--amber); letter-spacing: .04em; }
    @media (max-width: 720px) {
      .hero { grid-template-columns: 1fr; gap: 1.5rem; }
      h1 { font-size: clamp(2rem, 9vw, 4.25rem); }
      .machine { max-width: 36rem; width: 100%; justify-self: center; }
      .rail, .readouts { letter-spacing: .02em; }
    }
    @media (max-width: 380px) {
      .console { width: calc(100% - 2rem); }
      .readouts { flex-wrap: wrap; }
    }
    @media (prefers-reduced-motion: reduce) {
      .signal::before { animation: none; }
    }
  </style>
</head>
<body>
  <main class="console">
    <header class="rail">
      <span class="brand">ВОЛГА / ХРОНОМОДУЛЬ</span>
      <span class="signal">СИГНАЛ УСТОЙЧИВ</span>
    </header>
    <section class="hero" aria-labelledby="message">
      <div>
        <p class="eyebrow">01 / ПЕРЕХВАЧЕННАЯ РЕПЛИКА</p>
        <h1 id="message">Минуточку, Док. Ты что, сделал машину времени… <em>из Волги?</em></h1>
      </div>
      <figure class="machine">
        <svg viewBox="0 0 640 460" role="img" aria-labelledby="car-title">
          <title id="car-title">Волга на фоне светящихся колец машины времени</title>
          <defs>
            <linearGradient id="body" x2="0" y2="1" gradientUnits="objectBoundingBox">
              <stop stop-color="#a97656"/>
              <stop offset=".45" stop-color="#523025"/>
              <stop offset="1" stop-color="#201712"/>
            </linearGradient>
            <linearGradient id="glass" x2="0" y2="1" gradientUnits="objectBoundingBox">
              <stop stop-color="#44352e"/>
              <stop offset="1" stop-color="#171311"/>
            </linearGradient>
            <radialGradient id="glow">
              <stop stop-color="#ffad57" stop-opacity=".65"/>
              <stop offset="1" stop-color="#ff781e" stop-opacity="0"/>
            </radialGradient>
            <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
              <path d="M26 0H0V26" fill="none" stroke="#a77a54" stroke-opacity=".23"/>
            </pattern>
          </defs>
          <path d="M18 19h604v421H18z" fill="url(#grid)"/>
          <path d="M18 56V19h37m530 0h37v37M18 403v37h37m530 0h37v-37"
                fill="none" stroke="#a6764b" stroke-width="2"/>
          <g fill="none" stroke="#ffa450">
            <circle cx="340" cy="207" r="166" stroke-opacity=".27"/>
            <circle cx="340" cy="207" r="155" stroke-width="4" stroke-dasharray="2 9" stroke-opacity=".6"/>
            <circle cx="340" cy="207" r="140" stroke-opacity=".48"/>
            <circle cx="340" cy="207" r="115" stroke-opacity=".23"/>
            <path d="M340 31v27m0 298v27M164 207h27m298 0h27" stroke-opacity=".7"/>
            <path d="m96 233 63-33-16 24 67-20m264-22 51-46-11 26 44-26m-121 53 35-21"
                  stroke-width="2" stroke-linecap="round"/>
          </g>
          <ellipse cx="331" cy="358" rx="251" ry="35" fill="#080605" opacity=".8"/>
          <ellipse cx="536" cy="283" rx="86" ry="53" fill="url(#glow)"/>
          <path d="m81 291 12-28 97-20 69-56q15-11 41-12l88 2q18 0 33 16l51 51 64 9
                   q20 3 25 21l5 36-17 18-453 4-19-18z"
                fill="url(#body)" stroke="#e4ad79" stroke-width="2.5"/>
          <path d="m211 242 57-46q13-9 33-9l46 1-8 53zm141-54 32 1q16 0 26 12l40 41-100-1z"
                fill="url(#glass)" stroke="#c89b76" stroke-width="2"/>
          <path d="M187 249h278l62 9M88 282l89-14 294-7m-273-10-13 60m161-66-7 67
                   m116-63 12 50m-218-40h24m91 0h24"
                fill="none" stroke="#f5be8c" stroke-opacity=".72" stroke-width="2"/>
          <path d="M479 280h76l3 27h-86z" fill="#201813" stroke="#b28662" stroke-width="2"/>
          <path d="M482 293h71m-75 7h77m-85 15h91m-480 3h57m75 0h185"
                fill="none" stroke="#d2a783" stroke-width="3"/>
          <path d="M88 277h16v12H86z" fill="#ff7957"/>
          <circle cx="480" cy="284" r="11" fill="#ffd996" stroke="#fff2d0" stroke-width="2"/>
          <circle cx="549" cy="284" r="11" fill="#ffd996" stroke="#fff2d0" stroke-width="2"/>
          <g fill="#17120f" stroke="#755743" stroke-width="3">
            <circle cx="175" cy="325" r="38"/>
            <circle cx="437" cy="325" r="38"/>
          </g>
          <g fill="#a8876d" stroke="#eed2ab" stroke-width="2">
            <circle cx="175" cy="325" r="18"/>
            <circle cx="437" cy="325" r="18"/>
          </g>
          <g fill="#453026">
            <circle cx="175" cy="325" r="8"/>
            <circle cx="437" cy="325" r="8"/>
          </g>
          <g fill="#d1a47e" font-family="monospace" font-size="12" letter-spacing="2">
            <text x="35" y="47">GAZ / 24</text>
            <text x="605" y="422" text-anchor="end">FIG. 01</text>
          </g>
        </svg>
      </figure>
    </section>
    <dl class="readouts">
      <div><dt>КОРПУС</dt><dd>ГАЗ-24 «ВОЛГА»</dd></div>
      <div><dt>КОНТУР ВРЕМЕНИ</dt><dd>ЗАРЯЖЕН</dd></div>
      <div><dt>ТОЧКА ПРИБЫТИЯ</dt><dd>-- / -- / ----</dd></div>
    </dl>
  </main>
</body>
</html>
