<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>АНТРАКТ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: #000; color: #f2f2f2; overflow: hidden;
    font-family: "Cormorant SC", "Times New Roman", serif;
    display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none;
  }
  /* луч прожектора */
  .spot {
    position: fixed; inset: -20%;
    background: radial-gradient(ellipse 38% 44% at 50% 50%, rgba(255,255,255,.10), rgba(255,255,255,.03) 55%, transparent 75%);
    animation: breathe 7s ease-in-out infinite;
  }
  @keyframes breathe { 50% { opacity: .7; transform: scale(1.03); } }

  /* зерно плёнки и мерцание */
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; opacity: .06; pointer-events: none; mix-blend-mode: screen; }
  .flicker { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; animation: flick 5.3s steps(1) infinite; }
  @keyframes flick { 0% { opacity: 0 } 61% { opacity: .025 } 62% { opacity: 0 } 63% { opacity: .04 } 64%, 100% { opacity: 0 } }
  .scratch { position: fixed; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,.18); opacity: 0; pointer-events: none; }

  .card {
    position: relative; text-align: center;
    width: min(880px, calc(100vw - 32px));
    padding: clamp(36px, 7vw, 72px) clamp(16px, 5vw, 64px);
    border: 1px solid rgba(255,255,255,.7);
    outline: 1px solid rgba(255,255,255,.35); outline-offset: 7px;
    box-sizing: border-box;
    animation: sway 9s ease-in-out infinite;
  }
  @keyframes sway { 50% { transform: translateY(-2px); } }
  .corner { position: absolute; width: 34px; height: 34px; }
  .corner svg { display: block; width: 100%; height: 100%; }
  .tl { top: -12px; left: -12px; } .tr { top: -12px; right: -12px; transform: scaleX(-1); }
  .bl { bottom: -12px; left: -12px; transform: scaleY(-1); } .br { bottom: -12px; right: -12px; transform: scale(-1); }

  .orn { display: flex; align-items: center; justify-content: center; gap: 14px; color: rgba(255,255,255,.75); font-size: 14px; letter-spacing: .5em; }
  .orn::before, .orn::after { content: ""; height: 1px; width: min(120px, 18vw); background: linear-gradient(90deg, transparent, rgba(255,255,255,.7)); }
  .orn::after { transform: scaleX(-1); }

  h1 { margin: clamp(22px, 4vw, 36px) 0; font-weight: 500; line-height: 1.15; }
  h1 .a { display: block; font-size: clamp(22px, 4.6vw, 40px); letter-spacing: .32em; margin-right: -.32em; }
  h1 .b { display: block; margin-top: .35em; font-weight: 700; font-size: clamp(26px, 5.4vw, 56px); letter-spacing: .12em; margin-right: -.12em;
          text-shadow: 0 0 18px rgba(255,255,255,.25); }
  .w { display: inline-block; white-space: nowrap; }
  .ch { opacity: 0; display: inline-block; filter: blur(6px); animation: in 1.1s ease-out forwards; }
  @keyframes in { to { opacity: 1; filter: blur(0); } }

  .fade { opacity: 0; animation: show 2.5s ease forwards; }
  @keyframes show { to { opacity: 1; } }
</style>
</head>
<body>
<div class="spot"></div>
<div class="card">
  <div class="corner tl"><svg viewBox="0 0 34 34"><path d="M1 33V12C1 6 6 1 12 1h21M7 33V15c0-4 4-8 8-8h18" fill="none" stroke="#fff" stroke-opacity=".8"/><circle cx="12" cy="12" r="2" fill="#fff"/></svg></div>
  <div class="corner tr"><svg viewBox="0 0 34 34"><path d="M1 33V12C1 6 6 1 12 1h21M7 33V15c0-4 4-8 8-8h18" fill="none" stroke="#fff" stroke-opacity=".8"/><circle cx="12" cy="12" r="2" fill="#fff"/></svg></div>
  <div class="corner bl"><svg viewBox="0 0 34 34"><path d="M1 33V12C1 6 6 1 12 1h21M7 33V15c0-4 4-8 8-8h18" fill="none" stroke="#fff" stroke-opacity=".8"/><circle cx="12" cy="12" r="2" fill="#fff"/></svg></div>
  <div class="corner br"><svg viewBox="0 0 34 34"><path d="M1 33V12C1 6 6 1 12 1h21M7 33V15c0-4 4-8 8-8h18" fill="none" stroke="#fff" stroke-opacity=".8"/><circle cx="12" cy="12" r="2" fill="#fff"/></svg></div>

  <div class="orn fade">✦</div>
  <h1><span class="a">ДАМЫ И ГОСПОДА,</span><span class="b">ОБЪЯВЛЯЕТСЯ АНТРАКТ!</span></h1>
  <div class="orn fade" id="end">✦ ✦ ✦</div>
</div>
<div class="flicker"></div>
<canvas id="g"></canvas>
<script>
  // буквы проявляются по одной, как под светом прожектора
  var d = 600;
  document.querySelectorAll("h1 > span").forEach(function (line, li) {
    var words = line.textContent.split(" "); line.textContent = "";
    words.forEach(function (w, wi) {
      if (wi) { line.appendChild(document.createTextNode(" ")); d += li ? 85 : 55; }
      var word = document.createElement("span");
      word.className = "w";
      for (var i = 0; i < w.length; i++) {
        var s = document.createElement("span");
        s.className = "ch"; s.textContent = w[i];
        s.style.animationDelay = d + "ms";
        d += li ? 85 : 55;
        word.appendChild(s);
      }
      line.appendChild(word);
    });
    d += 500;
  });
  document.getElementById("end").style.animationDelay = d + "ms";

  // зерно старой плёнки
  var c = document.getElementById("g"), x = c.getContext("2d");
  c.width = 220; c.height = 140;
  var img = x.createImageData(c.width, c.height);
  (function grain() {
    for (var i = 0; i < img.data.length; i += 4) {
      var v = Math.random() * 255 | 0;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255;
    }
    x.putImageData(img, 0, 0);
    setTimeout(function () { requestAnimationFrame(grain); }, 60);
  })();

  // царапины на плёнке
  setInterval(function () {
    if (Math.random() > .35) return;
    var s = document.createElement("div");
    s.className = "scratch"; s.style.left = (Math.random() * 100) + "vw";
    document.body.appendChild(s);
    s.animate([{ opacity: 0 }, { opacity: 1 }, { opacity: 0 }], { duration: 180 + Math.random() * 300 }).onfinish = function () { s.remove(); };
  }, 700);
</script>
</body>
</html>
