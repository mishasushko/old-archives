<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>АНТРАКТ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;700&family=VT323&display=swap" rel="stylesheet">
<style>
  /* Антракт идёт по телевизору в тёмной гостиной. */
  html, body { margin: 0; height: 100%; }
  body { background: #000; color: #eee; overflow: hidden; font-family: "Cormorant SC", serif; user-select: none; -webkit-user-select: none;
         display: flex; align-items: center; justify-content: center; }
  .room { position: fixed; inset: -3%; background: url(room.jpg) center / cover; filter: brightness(.35) saturate(.6); animation: glow 3.7s infinite; }
  @keyframes glow { 0%, 100% { filter: brightness(.33) saturate(.6); } 47% { filter: brightness(.42) saturate(.6); } 49% { filter: brightness(.3) saturate(.6); } }
  .vig { position: fixed; inset: 0; background: radial-gradient(ellipse 60% 55% at 50% 50%, transparent 30%, rgba(0,0,0,.85) 100%); pointer-events: none; }

  .tv { position: relative; z-index: 2; width: min(720px, calc(100vw - 32px)); padding: 22px 22px 54px; box-sizing: border-box;
        background: linear-gradient(160deg, #4a3a2c, #2a1f17 60%, #1a130e); border-radius: 26px;
        box-shadow: 0 0 0 2px #120c08, 0 0 90px rgba(170,190,220,.18), 0 40px 120px #000; }
  .tv::after { content: ""; position: absolute; inset: 6px; border-radius: 22px; border: 1px solid rgba(255,255,255,.06); pointer-events: none; }
  .scr { position: relative; aspect-ratio: 4 / 3; background: #000; border-radius: 34px / 40px; overflow: hidden; box-shadow: inset 0 0 50px #000, 0 0 0 6px #0c0907; }
  .scr canvas, .scr video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .scr canvas { opacity: .22; }
  .scr video { opacity: 0; transition: opacity .2s; }
  .scr.ad video { opacity: 1; }
  .scr.ad canvas { opacity: .05; }
  .scr.ad .cast { opacity: 0; }
  .lines { position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.35) 0 1px, transparent 1px 3px); z-index: 3; }
  .bulge { position: absolute; inset: 0; pointer-events: none; z-index: 4; border-radius: inherit;
           background: radial-gradient(ellipse at 35% 25%, rgba(255,255,255,.09), transparent 45%), radial-gradient(ellipse at 50% 50%, transparent 60%, rgba(0,0,0,.6)); }
  .roll { position: absolute; left: 0; right: 0; height: 18%; z-index: 3; pointer-events: none;
          background: linear-gradient(transparent, rgba(255,255,255,.06), transparent); animation: roll 6s linear infinite; }
  @keyframes roll { from { top: -20%; } to { top: 110%; } }

  .osd { position: absolute; z-index: 5; font-family: "VT323", monospace; color: #8fff9a; text-shadow: 0 0 6px rgba(120,255,140,.7); font-size: clamp(16px, 3vw, 26px); }
  .osd.ch { top: 6%; left: 7%; }
  .osd.tm { top: 6%; right: 7%; }
  .osd.rec { bottom: 7%; left: 7%; color: #ff6b6b; text-shadow: 0 0 6px rgba(255,80,80,.7); animation: blink 1.2s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .cast { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 8%;
          animation: jit 7s infinite; transition: opacity .2s; }
  @keyframes jit { 0%, 92%, 100% { transform: none; } 93% { transform: translateX(6px) skewX(4deg); } 94% { transform: translateX(-4px); } 95% { transform: none; } }
  .cast .a { font-size: clamp(16px, 3.4vw, 28px); letter-spacing: .3em; margin-right: -.3em; }
  .cast .b { margin-top: .4em; font-weight: 700; font-size: clamp(24px, 5.6vw, 50px); letter-spacing: .08em; line-height: 1.1;
             text-shadow: 2px 0 rgba(255,40,40,.55), -2px 0 rgba(40,200,255,.55), 0 0 22px rgba(255,255,255,.35); }
  .cast .c { margin-top: 1.2em; font-size: clamp(12px, 2.2vw, 16px); letter-spacing: .3em; color: rgba(255,255,255,.6); }

  .panel { position: absolute; left: 26px; right: 26px; bottom: 12px; display: flex; align-items: center; gap: 14px; }
  .brand { font: 700 13px "Cormorant SC", serif; letter-spacing: .4em; color: #b9a58c; }
  .grill { flex: 1; height: 18px; background: repeating-linear-gradient(90deg, #120c08 0 3px, transparent 3px 6px); opacity: .7; }
  .knob { width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #8a7a66, #2b221a 70%); box-shadow: 0 2px 4px #000;
          border: 0; padding: 0; cursor: pointer; position: relative; }
  .knob::after { content: ""; position: absolute; left: 50%; top: 3px; width: 2px; height: 10px; background: #e8dcc8; transform: translateX(-50%); }
  .knob.on { transform: rotate(90deg); }
  .hint { position: fixed; z-index: 3; left: 0; right: 0; bottom: max(18px, env(safe-area-inset-bottom)); text-align: center; letter-spacing: .3em;
          font-size: clamp(12px, 2.2vw, 15px); color: rgba(255,255,255,.55); padding: 0 16px; }
  .hint b { color: #fff; font-weight: 500; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,.4); }
  .bar { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: #8fff9a; z-index: 6; box-shadow: 0 0 6px #8fff9a; }
</style>
</head>
<body>
<div class="room"></div>
<div class="vig"></div>
<div class="tv">
  <div class="scr" id="scr">
    <canvas id="g" width="160" height="120"></canvas>
    <video id="v" src="reklama.mp4" playsinline preload="none"></video>
    <div class="cast"><div class="a">ДАМЫ И ГОСПОДА,</div><div class="b">ОБЪЯВЛЯЕТСЯ<br>АНТРАКТ!</div><div class="c">не переключайтесь</div></div>
    <div class="osd ch" id="ch">КАНАЛ 1</div>
    <div class="osd tm" id="tm">--:--</div>
    <div class="osd rec">● ЭФИР</div>
    <div class="roll"></div><div class="lines"></div><div class="bulge"></div>
    <div class="bar" id="bar"></div>
  </div>
  <div class="panel"><span class="brand">ЭЛЕКТРОН</span><span class="grill"></span><button class="knob" id="knob" aria-label="переключить канал"></button></div>
</div>
<div class="hint">поверните ручку · <b id="go">канал 2: реклама</b></div>
<script>
  var $ = function (id) { return document.getElementById(id); };
  var v = $("v"), scr = $("scr");
  // помехи
  var g = $("g").getContext("2d"), im = g.createImageData(160, 120);
  (function snow() {
    for (var i = 0; i < im.data.length; i += 4) { var c = Math.random() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = c; im.data[i + 3] = 255; }
    g.putImageData(im, 0, 0); setTimeout(function () { requestAnimationFrame(snow); }, 50);
  })();
  // часы зрителя в углу экрана
  (function clock() { var d = new Date(); $("tm").textContent = (d.getHours() < 10 ? "0" : "") + d.getHours() + ":" + (d.getMinutes() < 10 ? "0" : "") + d.getMinutes(); setTimeout(clock, 5000); })();
  function zap() {
    scr.querySelector("canvas").style.opacity = 1;
    setTimeout(function () { scr.querySelector("canvas").style.opacity = ""; }, 260);
  }
  function setAd(on) {
    zap();
    if (on) { scr.className = "scr ad"; $("ch").textContent = "КАНАЛ 2"; $("knob").className = "knob on"; $("go").textContent = "канал 1: антракт"; v.currentTime = 0; v.play().catch(function () {}); }
    else { scr.className = "scr"; $("ch").textContent = "КАНАЛ 1"; $("knob").className = "knob"; $("go").textContent = "канал 2: реклама"; v.pause(); }
  }
  function toggle() { setAd(scr.className.indexOf("ad") < 0); }
  $("knob").onclick = toggle; $("go").onclick = toggle;
  v.onclick = function () { if (v.paused) v.play(); else v.pause(); };
  v.ontimeupdate = function () { $("bar").style.width = (v.duration ? v.currentTime / v.duration * 100 : 0) + "%"; };
  v.onended = function () { setTimeout(function () { setAd(false); }, 700); };
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && scr.className.indexOf("ad") >= 0) setAd(false); });
</script>
</body>
</html>
