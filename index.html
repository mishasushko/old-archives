<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>АНТРАКТ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: #000; color: #f2f2f2; overflow: hidden;
    font-family: "Cormorant SC", "Times New Roman", serif;
    display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none;
  }
  /* луч прожектора */
  .spot {
    position: fixed; inset: -20%;
    background: radial-gradient(ellipse 38% 44% at 50% 50%, rgba(255,255,255,.10), rgba(255,255,255,.03) 55%, transparent 75%);
    animation: breathe 7s ease-in-out infinite;
  }
  @keyframes breathe { 50% { opacity: .7; transform: scale(1.03); } }

  /* зерно плёнки и мерцание */
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; opacity: .06; pointer-events: none; mix-blend-mode: screen; }
  .flicker { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; animation: flick 5.3s steps(1) infinite; }
  @keyframes flick { 0% { opacity: 0 } 61% { opacity: .025 } 62% { opacity: 0 } 63% { opacity: .04 } 64%, 100% { opacity: 0 } }
  .scratch { position: fixed; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,.18); opacity: 0; pointer-events: none; }

  .card {
    position: relative; text-align: center;
    width: min(880px, calc(100vw - 32px));
    padding: clamp(36px, 7vw, 72px) clamp(16px, 5vw, 64px);
    border: 1px solid rgba(255,255,255,.7);
    outline: 1px solid rgba(255,255,255,.35); outline-offset: 7px;
    box-sizing: border-box;
    animation: sway 9s ease-in-out infinite;
  }
  @keyframes sway { 50% { transform: translateY(-2px); } }
  .corner { position: absolute; width: 34px; height: 34px; }
  .corner svg { display: block; width: 100%; height: 100%; }
  .tl { top: -12px; left: -12px; } .tr { top: -12px; right: -12px; transform: scaleX(-1); }
  .bl { bottom: -12px; left: -12px; transform: scaleY(-1); } .br { bottom: -12px; right: -12px; transform: scale(-1); }

  .orn { display: flex; align-items: center; justify-content: center; gap: 14px; color: rgba(255,255,255,.75); font-size: 14px; letter-spacing: .5em; }
  .orn::before, .orn::after { content: ""; height: 1px; width: min(120px, 18vw); background: linear-gradient(90deg, transparent, rgba(255,255,255,.7)); }
  .orn::after { transform: scaleX(-1); }

  h1 { margin: clamp(22px, 4vw, 36px) 0; font-weight: 500; line-height: 1.15; }
  h1 .a { display: block; font-size: clamp(22px, 4.6vw, 40px); letter-spacing: .32em; margin-right: -.32em; }
  h1 .b { display: block; margin-top: .35em; font-weight: 700; font-size: clamp(26px, 5.4vw, 56px); letter-spacing: .12em; margin-right: -.12em;
          text-shadow: 0 0 18px rgba(255,255,255,.25); }
  .w { display: inline-block; white-space: nowrap; }
  .ch { opacity: 0; display: inline-block; filter: blur(6px); animation: in 1.1s ease-out forwards; }
  @keyframes in { to { opacity: 1; filter: blur(0); } }

  .cd { margin-top: clamp(20px, 3.5vw, 30px); }
  .cd .lbl { font-size: clamp(13px, 2.2vw, 17px); letter-spacing: .35em; margin-right: -.35em; color: rgba(255,255,255,.65); }
  .cd .num { margin-top: 8px; font-family: "Cormorant SC", serif; font-weight: 700; font-size: clamp(34px, 7vw, 64px); letter-spacing: .14em; margin-right: -.14em;
             font-variant-numeric: lining-nums tabular-nums; text-shadow: 0 0 22px rgba(255,255,255,.3); }
  .cd .num.last { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
  .fade { opacity: 0; animation: show 2.5s ease forwards; }
  @keyframes show { to { opacity: 1; } }
  /* реклама в антракте */
  .adbtn { display: block; margin: clamp(18px, 3vw, 26px) auto 0; background: none; border: 1px solid rgba(255,255,255,.4); color: #f2f2f2;
           font: 500 clamp(13px, 2.2vw, 16px) "Cormorant SC", serif; letter-spacing: .3em; padding: 8px 16px 8px calc(16px + .3em); cursor: pointer; }
  .adbtn:hover, .adbtn:focus-visible { background: #f2f2f2; color: #000; outline: none; }
  #adv { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.92); display: none; align-items: center; justify-content: center;
         padding: 16px; box-sizing: border-box; }
  #adv.on { display: flex; }
  .tv { position: relative; width: min(560px, 100%); padding: 16px 16px 36px; background: linear-gradient(#3a3a3a, #161616); border-radius: 20px;
        box-shadow: 0 0 0 1px #555, 0 30px 80px #000; box-sizing: border-box; }
  .tv .scr { aspect-ratio: 4 / 3; background: #000; border-radius: 16px / 20px; overflow: hidden; box-shadow: inset 0 0 30px #000; }
  .tv video { display: block; width: 100%; height: 100%; object-fit: cover; cursor: pointer; }
  .tv .lbl { position: absolute; left: 22px; bottom: 11px; font: 500 11px "Cormorant SC", serif; letter-spacing: .3em; color: #888; }
  .tv .knobs { position: absolute; right: 20px; bottom: 10px; display: flex; gap: 8px; }
  .tv .knobs i { width: 13px; height: 13px; border-radius: 50%; background: #666; box-shadow: inset -2px -2px 3px #222; }
  .tv .x { position: absolute; top: -40px; right: 0; background: none; border: 0; color: #aaa; font: 500 15px "Cormorant SC", serif; letter-spacing: .25em; cursor: pointer; }
  .tv .x:hover { color: #fff; }
  .tv .bar { position: absolute; left: 118px; right: 74px; bottom: 15px; height: 3px; background: #333; }
  .tv .bar i { display: block; height: 100%; width: 0; background: #bbb; }
</style>
</head>
<body>
<div class="spot"></div>
<div class="card">
  <div class="corner tl"><svg viewBox="0 0 34 34"><path d="M1 33V12C1 6 6 1 12 1h21M7 33V15c0-4 4-8 8-8h18" fill="none" stroke="#fff" stroke-opacity=".8"/><circle cx="12" cy="12" r="2" fill="#fff"/></svg></div>
  <div class="corner tr"><svg viewBox="0 0 34 34"><path d="M1 33V12C1 6 6 1 12 1h21M7 33V15c0-4 4-8 8-8h18" fill="none" stroke="#fff" stroke-opacity=".8"/><circle cx="12" cy="12" r="2" fill="#fff"/></svg></div>
  <div class="corner bl"><svg viewBox="0 0 34 34"><path d="M1 33V12C1 6 6 1 12 1h21M7 33V15c0-4 4-8 8-8h18" fill="none" stroke="#fff" stroke-opacity=".8"/><circle cx="12" cy="12" r="2" fill="#fff"/></svg></div>
  <div class="corner br"><svg viewBox="0 0 34 34"><path d="M1 33V12C1 6 6 1 12 1h21M7 33V15c0-4 4-8 8-8h18" fill="none" stroke="#fff" stroke-opacity=".8"/><circle cx="12" cy="12" r="2" fill="#fff"/></svg></div>

  <div class="orn fade">✦</div>
  <h1><span class="a">ДАМЫ И ГОСПОДА,</span><span class="b">ОБЪЯВЛЯЕТСЯ АНТРАКТ!</span></h1>
  <div class="orn fade" id="end">✦ ✦ ✦</div>
  <div class="cd fade" id="cdw">
    <div class="lbl" id="lbl">до третьего отделения</div>
    <div class="num" id="cd">--:--:--</div>
  </div>
  <button class="adbtn fade" id="adb">во время антракта · реклама</button>
</div>
<div id="adv">
  <div class="tv">
    <button class="x" id="adx">закрыть ✕</button>
    <div class="scr"><video id="adv-v" src="reklama.mp4" playsinline preload="none"></video></div>
    <div class="bar"><i id="adbar"></i></div>
    <span class="lbl">ЭЛЕКТРОН</span><span class="knobs"><i></i><i></i></span>
  </div>
</div>
<div class="flicker"></div>
<canvas id="g"></canvas>
<script>
  // буквы проявляются по одной, как под светом прожектора
  var d = 600;
  document.querySelectorAll("h1 > span").forEach(function (line, li) {
    var words = line.textContent.split(" "); line.textContent = "";
    words.forEach(function (w, wi) {
      if (wi) { line.appendChild(document.createTextNode(" ")); d += li ? 85 : 55; }
      var word = document.createElement("span");
      word.className = "w";
      for (var i = 0; i < w.length; i++) {
        var s = document.createElement("span");
        s.className = "ch"; s.textContent = w[i];
        s.style.animationDelay = d + "ms";
        d += li ? 85 : 55;
        word.appendChild(s);
      }
      line.appendChild(word);
    });
    d += 500;
  });
  document.getElementById("end").style.animationDelay = d + "ms";

  document.getElementById("cdw").style.animationDelay = (d + 600) + "ms";
  // третье отделение: 20:00 по Москве, 3 ноября 2026
  var END = Date.UTC(2026, 10, 3, 17, 0, 0);
  function two(n) { return (n < 10 ? "0" : "") + n; }
  (function tick() {
    var s = Math.max(0, Math.floor((END - Date.now()) / 1000)), el = document.getElementById("cd");
    el.textContent = two(Math.floor(s / 3600)) + ":" + two(Math.floor(s / 60) % 60) + ":" + two(s % 60);
    el.className = s <= 60 && s > 0 ? "num last" : "num";
    if (s === 0) {
      document.getElementById("lbl").textContent = "антракт окончен";
      document.querySelector("h1 .b").textContent = "ЗАНАВЕС ПОДНИМАЕТСЯ";
      document.querySelector("h1 .b").style.letterSpacing = ".08em";
      // как только на сайте появится третье отделение — открыть его
      (function poll() {
        fetch("./?t=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.text(); }).then(function (h) {
          if (h.indexOf("<title>АНТРАКТ</title>") < 0) location.reload();
        }).catch(function () {});
        setTimeout(poll, 10000);
      })();
      return;
    }
    setTimeout(tick, 1000 - Date.now() % 1000);
  })();

  // реклама в антракте
  var adv = document.getElementById("adv"), v = document.getElementById("adv-v");
  document.getElementById("adb").style.animationDelay = (d + 900) + "ms";
  document.getElementById("adb").onclick = function () { adv.className = "on"; v.currentTime = 0; v.play().catch(function () {}); };
  function closeAd() { v.pause(); adv.className = ""; }
  document.getElementById("adx").onclick = closeAd;
  adv.onclick = function (e) { if (e.target === adv) closeAd(); };
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeAd(); });
  v.onclick = function () { if (v.paused) v.play(); else v.pause(); };
  v.ontimeupdate = function () { document.getElementById("adbar").style.width = (v.duration ? v.currentTime / v.duration * 100 : 0) + "%"; };
  v.onended = function () { setTimeout(closeAd, 800); };

  // зерно старой плёнки
  var c = document.getElementById("g"), x = c.getContext("2d");
  c.width = 220; c.height = 140;
  var img = x.createImageData(c.width, c.height);
  (function grain() {
    for (var i = 0; i < img.data.length; i += 4) {
      var v = Math.random() * 255 | 0;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255;
    }
    x.putImageData(img, 0, 0);
    setTimeout(function () { requestAnimationFrame(grain); }, 60);
  })();

  // царапины на плёнке
  setInterval(function () {
    if (Math.random() > .35) return;
    var s = document.createElement("div");
    s.className = "scratch"; s.style.left = (Math.random() * 100) + "vw";
    document.body.appendChild(s);
    s.animate([{ opacity: 0 }, { opacity: 1 }, { opacity: 0 }], { duration: 180 + Math.random() * 300 }).onfinish = function () { s.remove(); };
  }, 700);
</script>
</body>
</html>
