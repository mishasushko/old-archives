<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>АНТРАКТ</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;700&family=VT323&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; }
  body { background: #000; color: #eee; overflow: hidden; font-family: "Cormorant SC", serif; user-select: none; -webkit-user-select: none;
         display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
  .hall { position: fixed; inset: -3%; background: url(hall.jpg) center / cover; filter: brightness(.28) sepia(.4); }
  .beam { position: fixed; left: 50%; top: -10%; width: 140vw; height: 70vh; transform: translateX(-50%); pointer-events: none;
          background: radial-gradient(ellipse 30% 100% at 50% 0%, rgba(255,240,200,.12), transparent 70%); animation: fl .13s infinite; }
  @keyframes fl { 50% { opacity: .85; } }
  .vig { position: fixed; inset: 0; background: radial-gradient(ellipse 60% 55% at 50% 50%, transparent 35%, rgba(0,0,0,.9) 100%); pointer-events: none; }
  .scr { position: relative; z-index: 2; width: min(760px, calc(100vw - 32px)); aspect-ratio: 16 / 10; background: #d9d2c0; overflow: hidden;
         box-shadow: 0 0 0 10px #0b0907, 0 0 120px rgba(255,235,190,.25); animation: fl .11s infinite; }
  .scr video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; opacity: 0; }
  .scr.ad video { opacity: 1; }
  .scr.ad .lead { display: none; }
  .lead { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #1a1612; text-align: center; }
  .ring { position: absolute; width: 62%; aspect-ratio: 1; border-radius: 50%; border: 3px solid #1a1612; }
  .ring.b { width: 48%; }
  .cross { position: absolute; inset: 0; background: linear-gradient(#1a1612, #1a1612) center / 2px 100% no-repeat, linear-gradient(#1a1612, #1a1612) center / 100% 2px no-repeat; opacity: .6; }
  .sweep { position: absolute; width: 62%; aspect-ratio: 1; border-radius: 50%; background: conic-gradient(rgba(0,0,0,.35) var(--a, 0deg), transparent 0); }
  .num { position: relative; font: 700 clamp(70px, 18vw, 170px) "Cormorant SC", serif; line-height: 1; }
  .txt { position: absolute; bottom: 9%; left: 0; right: 0; text-align: center; color: #1a1612; }
  .txt b { display: block; font-size: clamp(22px, 5vw, 44px); letter-spacing: .1em; }
  .txt small { font-size: clamp(11px, 2vw, 14px); letter-spacing: .4em; }
  .dust { position: absolute; inset: 0; pointer-events: none; z-index: 3; mix-blend-mode: multiply; }
  .scr.ad .dust { mix-blend-mode: screen; opacity: .5; }
  .tag { position: absolute; top: 4%; left: 4%; z-index: 4; font: 18px "VT323", monospace; color: #1a1612; letter-spacing: .1em; }
  .scr.ad .tag { color: #e8dcc0; }
  .reels { position: relative; z-index: 2; display: flex; gap: 22px; }
  .reels button { background: none; border: 0; padding: 0; cursor: pointer; color: rgba(255,255,255,.6); font: 500 13px "Cormorant SC", serif; letter-spacing: .3em; text-align: center; }
  .reels img { width: 64px; height: 64px; display: block; margin: 0 auto 6px; filter: brightness(.75); transition: filter .2s; }
  .reels button:hover img { filter: brightness(1); }
  .reels button.on img { filter: brightness(1.1) drop-shadow(0 0 10px rgba(255,235,190,.6)); animation: spin 2s linear infinite; }
  .reels button.on { color: #fff; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hint { position: relative; z-index: 2; font-size: 13px; letter-spacing: .3em; color: rgba(255,255,255,.45); text-align: center; padding: 0 16px; }
</style>
</head>
<body>
<div class="hall"></div><div class="beam"></div><div class="vig"></div>
<div class="scr" id="scr">
  <video id="v" playsinline preload="none"></video>
  <div class="lead"><div class="sweep" id="sw"></div><div class="ring"></div><div class="ring b"></div><div class="cross"></div><div class="num" id="num">8</div>
    <div class="txt"><b>ОБЪЯВЛЯЕТСЯ АНТРАКТ</b><small>киностудия сектор-69 · не выходите из зала</small></div></div>
  <canvas class="dust" id="d" width="320" height="200"></canvas>
  <div class="tag" id="tag">АНТРАКТ</div>
</div>
<div class="reels" id="reels">
  <button data-s="reklama.mp4"><img src="reel.png" alt="">плёнка 1</button>
  <button data-s="reklama3.mp4"><img src="reel.png" alt="">плёнка 2</button>
  <button data-s="reklama4.mp4"><img src="reel.png" alt="">плёнка 3</button>
</div>
<div class="hint" id="hint">во время антракта · реклама на плёнках</div>
<script>
  var $ = function (id) { return document.getElementById(id); }, v = $("v"), scr = $("scr");
  // отсчёт ракорда
  var n = 8, t0 = Date.now();
  (function lead() { var p = ((Date.now() - t0) % 1000) / 1000; $("sw").style.setProperty("--a", p * 360 + "deg");
    var k = 8 - Math.floor((Date.now() - t0) / 1000) % 7; if (k !== n) { n = k; $("num").textContent = n; } requestAnimationFrame(lead); })();
  // пыль и царапины
  var g = $("d").getContext("2d");
  (function dust() { g.clearRect(0, 0, 320, 200); g.fillStyle = "rgba(0,0,0,.5)"; g.strokeStyle = "rgba(0,0,0,.35)";
    for (var i = 0; i < 14; i++) g.fillRect(Math.random() * 320, Math.random() * 200, Math.random() * 2 + .5, Math.random() * 2 + .5);
    if (Math.random() < .5) { var x = Math.random() * 320; g.beginPath(); g.moveTo(x, 0); g.lineTo(x + Math.random() * 4 - 2, 200); g.stroke(); }
    setTimeout(dust, 70); })();
  var bs = document.querySelectorAll("#reels button"), cur = -1;
  function stop() { v.pause(); scr.className = "scr"; cur = -1; $("tag").textContent = "АНТРАКТ"; [].forEach.call(bs, function (b) { b.className = ""; }); }
  [].forEach.call(bs, function (b, i) { b.onclick = function () {
    if (cur === i) { stop(); return; }
    stop(); cur = i; b.className = "on"; scr.className = "scr ad"; $("tag").textContent = "ПЛЁНКА " + (i + 1);
    v.src = b.getAttribute("data-s"); v.currentTime = 0; v.play().catch(function () {}); }; });
  v.onclick = function () { if (v.paused) v.play(); else v.pause(); };
  v.onended = function () { setTimeout(stop, 700); };
</script>
</body>
</html>
