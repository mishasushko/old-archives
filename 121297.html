<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>&nbsp;</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #000; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px 16px; box-sizing: border-box; }
  .ph { position: relative; width: 100%; max-width: 900px; }
  .ph.hit img { filter: brightness(0.35); transition: filter 0.6s; }
  img { display: block; width: 100%; max-width: 900px; height: auto; opacity: 0; animation: in 6s ease-in 0.5s forwards; }
  p { color: #bbb; font: 16px "Courier New", monospace; letter-spacing: 2px; margin: 28px 0 0; min-height: 1.4em; text-align: center; }
  @keyframes in { to { opacity: 1; } }
</style>
</head>
<body>
<div class="ph"><img src="121297.jpg" alt=""></div>
<audio id="a" src="dver.mp3" preload="auto"></audio>
<p id="t"></p>
<script>
  var text = "оно последовало за мной до дома", i = 0, el = document.getElementById("t");
  function type() {
    if (i > text.length) return;
    el.textContent = text.slice(0, i++);
    setTimeout(type, 90 + Math.random() * 160);
  }
  setTimeout(type, 6500);

  var ph = document.querySelector(".ph"), img = ph.querySelector("img"), snd = document.getElementById("a");
  function settle() { img.style.animation = "none"; img.style.opacity = "1"; }
  img.addEventListener("animationend", settle);
  ph.onclick = function () {
    settle();
    snd.currentTime = 0;
    snd.play();
    ph.className = "ph hit";
    setTimeout(function () { ph.className = "ph"; }, 1800);
  };
</script>
<script>
  try { localStorage.setItem("seen_121297", "1"); } catch (e) {}
</script>
</body>
</html>
