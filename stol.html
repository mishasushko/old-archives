<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>&nbsp;</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #000; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px 16px; box-sizing: border-box; }
  .ph { position: relative; width: 100%; max-width: 900px; cursor: default; }
  img { display: block; width: 100%; height: auto; opacity: 0; animation: in 6s ease-in 0.5s forwards; }
  .ph.hit img { animation: none; opacity: 1; filter: brightness(1.8) contrast(1.3); transform: translate(var(--x, 3px), var(--y, -2px)) scale(1.03); }
  p { color: #bbb; font: 16px "Courier New", monospace; letter-spacing: 2px; margin: 28px 0 0; min-height: 1.4em; text-align: center; }
  #vz { position: absolute; left: 52%; top: 60%; width: 17%; height: 13%; }
  #tb { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 5; cursor: default; }
  #tb.on { display: flex; }
  #tb img { width: min(320px, 70vw); opacity: 0; animation: rise 2.5s ease-out forwards; }
  #tb p { margin-top: 24px; }
  @keyframes rise { from { opacity: 0; transform: scale(.4) rotate(-200deg); } to { opacity: 1; transform: none; } }
  @keyframes in { to { opacity: 1; } }
</style>
</head>
<body>
<div class="ph"><img src="stol.jpg" alt=""><div id="vz"></div></div>
<div id="tb"><img src="tabu.gif" alt=""><p id="tt"></p></div>
<p id="t"></p>
<audio id="a" src="stol.mp3" preload="auto"></audio>
<script>
  var text = "оно знало, где мы храним сладкое", el = document.getElementById("t"), typing = false;
  var ph = document.querySelector(".ph"), img = ph.querySelector("img"), snd = document.getElementById("a");

  function type(i) {
    if (i > text.length) { typing = false; return; }
    el.textContent = text.slice(0, i);
    setTimeout(function () { type(i + 1); }, 90 + Math.random() * 160);
  }

  function settle() { img.style.animation = "none"; img.style.opacity = "1"; }
  img.addEventListener("animationend", settle);

  var tb = document.getElementById("tb"), tt = document.getElementById("tt"), tbImg = tb.querySelector("img");
  document.getElementById("vz").onclick = function (e) {
    e.stopPropagation();
    settle();
    var line = "и... ты проживёшь дольше", i = 0;
    tt.textContent = "";
    tbImg.style.animation = "none"; tbImg.offsetWidth; tbImg.style.animation = "";
    tb.className = "on";
    (function t() {
      if (i > line.length) return;
      tt.textContent = line.slice(0, i++);
      setTimeout(t, 110 + Math.random() * 180);
    })();
  };
  tb.onclick = function () { tb.className = ""; };

  ph.onclick = function () {
    settle();
    snd.currentTime = 0;
    snd.play();
    var n = 0;
    (function shake() {
      ph.style.setProperty("--x", (Math.random() * 14 - 7) + "px");
      ph.style.setProperty("--y", (Math.random() * 10 - 5) + "px");
      ph.className = n % 3 === 2 ? "ph" : "ph hit";
      if (++n < 14) setTimeout(shake, 60);
      else ph.className = "ph";
    })();
    if (!typing && el.textContent !== text) { typing = true; setTimeout(function () { type(0); }, 900); }
  };
</script>
<script>
  try { localStorage.setItem("seen_stol", "1"); } catch (e) {}
</script>
</body>
</html>
